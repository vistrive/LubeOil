[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobp-control-system"
version = "0.1.0"
description = "AI-powered Lube Oil Blending Plant Control System (meta-package)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "LOBP Team" }
]
keywords = ["lube-oil", "blending", "ai", "dcs", "plc", "industrial-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Meta-package: installs all component packages.
# For lighter CI/CD deploys, install individual packages instead:
#   pip install lobp-core          # ~6 deps  - models, schemas, DB, config
#   pip install lobp-ai            # ~3 deps  - AI/ML engine (+ lobp-core)
#   pip install lobp-llm           # ~3 deps  - LLM providers (+ lobp-core)
#   pip install lobp-services      # ~5 deps  - business logic (+ lobp-core, lobp-ai)
#   pip install lobp-api           # ~8 deps  - FastAPI web app (+ lobp-core, lobp-services, lobp-llm)
#
# For heavy ML training workloads:
#   pip install lobp-ai[ml]        # adds tensorflow, scikit-learn, pandas
dependencies = [
    "lobp-core==0.1.0",
    "lobp-ai==0.1.0",
    "lobp-llm==0.1.0",
    "lobp-services==0.1.0",
    "lobp-api==0.1.0",
    # Infra deps not tied to a specific component
    "redis>=5.0.1",
    "celery>=5.3.6",
    "websockets>=12.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
# Install everything including heavy ML dependencies
all = [
    "lobp-ai[ml]==0.1.0",
]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
lobp = "lobp.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
