[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobp-llm"
version = "0.1.0"
description = "LOBP Control System - LLM provider integrations (Anthropic, OpenAI, Ollama, Sarvam)"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LOBP Team" }]
keywords = ["lube-oil", "blending", "llm"]
dependencies = [
    "lobp-core==0.1.0",
    "httpx>=0.26.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lobp"]
