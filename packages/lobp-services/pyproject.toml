[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobp-services"
version = "0.1.0"
description = "LOBP Control System - Business logic services (blending, quality, inventory, etc.)"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LOBP Team" }]
keywords = ["lube-oil", "blending", "services"]
dependencies = [
    "lobp-core==0.1.0",
    "lobp-ai==0.1.0",
    "numpy>=1.26.3",
    "openpyxl>=3.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lobp"]
