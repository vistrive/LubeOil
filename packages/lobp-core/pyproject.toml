[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobp-core"
version = "0.1.0"
description = "LOBP Control System - Core models, schemas, DB, and configuration"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LOBP Team" }]
keywords = ["lube-oil", "blending", "core"]
dependencies = [
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lobp"]
