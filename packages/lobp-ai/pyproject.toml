[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobp-ai"
version = "0.1.0"
description = "LOBP Control System - AI/ML engine for recipe optimization and quality prediction"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LOBP Team" }]
keywords = ["lube-oil", "blending", "ai", "machine-learning"]
dependencies = [
    "lobp-core==0.1.0",
    "numpy>=1.26.3",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# Heavy ML deps - install only when training models or running advanced features
ml = [
    "scikit-learn>=1.4.0",
    "tensorflow>=2.15.0",
    "pandas>=2.1.4",
]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lobp"]
